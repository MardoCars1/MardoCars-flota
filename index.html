<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MardoCars - Flota</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e2e8f0;font-family:'DM Sans',sans-serif}
input,select,button{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = supabase;

const DB = createClient(
  "https://krjrjhkyabjsgaxrvsoq.supabase.co",
  "sb_publishable_ZcVgKCdII5aqKNF1BwN3Ww_a5Pd7fe3"
);

const STATUS = {
  disponible:  { label:"Disponible",  color:"#22c55e", bg:"#052e16" },
  alquilado:   { label:"Alquilado",   color:"#f59e0b", bg:"#2d1b00" },
  taller:      { label:"En Taller",   color:"#ef4444", bg:"#2d0a0a" },
  por_recibir: { label:"Por Recibir", color:"#818cf8", bg:"#1a1a3e" },
};

const DOCS = [
  { key:"soat",             label:"SOAT" },
  { key:"tecnomecanica",    label:"Tecnomecanica" },
  { key:"tarjeta_propiedad",label:"T.Propiedad" },
  { key:"seguro",           label:"Seguro" },
];

function docsOk(c){ return DOCS.every(d => c[d.key]); }
function docsFalt(c){ return DOCS.filter(d=>!c[d.key]).map(d=>d.label); }

function Badge({color, bg, children}){
  return <span style={{fontSize:11,fontWeight:700,color,background:bg,padding:"3px 10px",borderRadius:20}}>{children}</span>;
}

function App(){
  const [view,    setView]   = useState("dashboard");
  const [cars,    setCars]   = useState([]);
  const [loading, setLoading]= useState(true);
  const [filter,  setFilter] = useState("todos");
  const [modal,   setModal]  = useState(null);
  const [form,    setForm]   = useState({});
  const [saving,  setSaving] = useState(false);
  const [msgs,    setMsgs]   = useState([]);
  const [aiInp,   setAiInp]  = useState("");
  const [aiLoad,  setAiLoad] = useState(false);

  async function load(){
    setLoading(true);
    const {data} = await DB.from("vehiculos").select("*").order("id");
    if(data) setCars(data);
    setLoading(false);
  }

  useEffect(()=>{ load(); },[]);

  const total    = cars.length;
  const disp     = cars.filter(c=>c.status==="disponible").length;
  const alq      = cars.filter(c=>c.status==="alquilado").length;
  const tall     = cars.filter(c=>c.status==="taller").length;
  const sinDocs  = cars.filter(c=>!docsOk(c)).length;
  const listos   = cars.filter(c=>c.status==="disponible"&&docsOk(c)).length;
  const ingresos = cars.filter(c=>c.status==="alquilado"&&c.alquiler_inicio&&c.alquiler_fin)
    .reduce((a,c)=>{
      const d=Math.max(1,Math.ceil((new Date(c.alquiler_fin)-new Date(c.alquiler_inicio))/86400000));
      return a+d*(c.valor_dia||0);
    },0);

  const filtered = filter==="todos" ? cars : cars.filter(c=>c.status===filter);

  function openNew(){
    setForm({marca:"",modelo:"",placa:"",ano:2024,color:"",status:"disponible",
      soat:false,tecnomecanica:false,tarjeta_propiedad:false,seguro:false,
      cliente_nombre:"",cliente_cedula:"",alquiler_inicio:"",alquiler_fin:"",
      valor_dia:"",taller_motivo:"",taller_fecha:"",notas:""});
    setModal("form");
  }
  function openEdit(car){ setForm({...car}); setModal("form"); }

  async function save(){
    setSaving(true);
    const p={
      marca:form.marca, modelo:form.modelo, placa:form.placa,
      ano:parseInt(form.ano)||2024, color:form.color, status:form.status,
      soat:!!form.soat, tecnomecanica:!!form.tecnomecanica,
      tarjeta_propiedad:!!form.tarjeta_propiedad, seguro:!!form.seguro,
      cliente_nombre:form.cliente_nombre||null,
      cliente_cedula:form.cliente_cedula||null,
      alquiler_inicio:form.alquiler_inicio||null,
      alquiler_fin:form.alquiler_fin||null,
      valor_dia:parseInt(form.valor_dia)||null,
      taller_motivo:form.taller_motivo||null,
      taller_fecha:form.taller_fecha||null,
      notas:form.notas||null,
    };
    if(form.id){ await DB.from("vehiculos").update(p).eq("id",form.id); }
    else { await DB.from("vehiculos").insert(p); }
    await load();
    setSaving(false);
    setModal(null);
  }

  async function del(id){
    if(!confirm("Eliminar este vehiculo?")) return;
    await DB.from("vehiculos").delete().eq("id",id);
    await load();
  }

  async function askAI(q){
    setAiLoad(true);
    const um={role:"user",content:q};
    setMsgs(m=>[...m,um]);
    setAiInp("");
    const ctx=`Flota MardoCars: ${total} vehiculos. Disp:${disp} Alq:${alq} Taller:${tall} SinDocs:${sinDocs} Listos:${listos} Ingresos:$${ingresos.toLocaleString("es-CO")}
${cars.map(c=>`${c.marca} ${c.modelo} ${c.placa} [${STATUS[c.status]?.label}] falta:${docsFalt(c).join(",")||"ninguno"}${c.cliente_nombre?` cliente:${c.cliente_nombre} hasta:${c.alquiler_fin}`:""}`).join("\n")}`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:800,
          system:`Eres experto en flotas de alquiler en Colombia. Responde en espanol, conciso y practico.\n${ctx}`,
          messages:[...msgs,um].map(m=>({role:m.role,content:m.content})),
        })
      });
      const data=await r.json();
      const txt=data.content?.find(b=>b.type==="text")?.text||"Sin respuesta.";
      setMsgs(m=>[...m,{role:"assistant",content:txt}]);
    }catch(e){
      setMsgs(m=>[...m,{role:"assistant",content:"Error de conexion."}]);
    }
    setAiLoad(false);
  }

  const nav=[
    {id:"dashboard",icon:"D",label:"Dashboard"},
    {id:"flota",    icon:"F",label:"Mi Flota"},
    {id:"docs",     icon:"O",label:"Documentos"},
    {id:"alq",      icon:"A",label:"Alquileres"},
    {id:"ia",       icon:"I",label:"Asistente IA"},
  ];

  const inp={width:"100%",background:"#0a0a0f",border:"1px solid #2a2a3e",borderRadius:8,padding:"9px 12px",color:"#e2e8f0",fontSize:13,outline:"none"};
  const card={background:"#0f0f1a",border:"1px solid #1e1e2e",borderRadius:12,padding:16};

  return (
    <div style={{display:"flex",minHeight:"100vh"}}>
      <div style={{width:190,background:"#0f0f1a",borderRight:"1px solid #1e1e2e",display:"flex",flexDirection:"column",position:"sticky",top:0,height:"100vh"}}>
        <div style={{padding:"18px 14px",borderBottom:"1px solid #1e1e2e"}}>
          <div style={{fontSize:16,fontWeight:900,color:"#f97316"}}>MardoCars</div>
          <div style={{fontSize:11,color:"#4a4a6a",marginTop:2}}>Gestion de flota</div>
        </div>
        {nav.map(n=>(
          <div key={n.id} onClick={()=>setView(n.id)} style={{
            display:"flex",alignItems:"center",gap:8,padding:"11px 14px",
            cursor:"pointer",fontSize:13,fontWeight:view===n.id?700:400,
            color:view===n.id?"#f97316":"#6b7280",
            background:view===n.id?"#1a1000":"transparent",
            borderLeft:view===n.id?"3px solid #f97316":"3px solid transparent",
          }}>
            {n.label}
          </div>
        ))}
        <div style={{marginTop:"auto",padding:12,borderTop:"1px solid #1e1e2e",fontSize:11,color:"#4a4a6a",textAlign:"center"}}>
          {alq} alquilados / {disp} disponibles
        </div>
      </div>

      <div style={{flex:1,padding:"22px 24px",overflowY:"auto",maxHeight:"100vh"}}>

        {view==="dashboard" && (
          <div>
            <div style={{fontSize:22,fontWeight:900,color:"#f1f5f9",marginBottom:4}}>Dashboard</div>
            <div style={{fontSize:13,color:"#4a4a6a",marginBottom:18}}>{new Date().toLocaleDateString("es-CO",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
            {sinDocs>0 && (
              <div style={{background:"#2d1500",border:"1px solid #f97316",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#fb923c"}}>
                Atencion: {sinDocs} vehiculos con documentos incompletos
              </div>
            )}
            {loading ? <div style={{color:"#4a4a6a",padding:20}}>Cargando...</div> : (
              <>
                <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14}}>
                  {[
                    {l:"Total",      v:total, c:"#818cf8"},
                    {l:"Disponibles",v:disp,  c:"#22c55e"},
                    {l:"Alquilados", v:alq,   c:"#f59e0b"},
                    {l:"En Taller",  v:tall,  c:"#ef4444"},
                  ].map((s,i)=>(
                    <div key={i} style={{...card,border:`1px solid ${s.c}33`}}>
                      <div style={{fontSize:28,fontWeight:900,color:s.c}}>{s.v}</div>
                      <div style={{fontSize:11,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>{s.l}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  <div style={{...card,border:"1px solid #f9731633"}}>
                    <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>INGRESOS ACTIVOS</div>
                    <div style={{fontSize:22,fontWeight:900,color:"#f97316"}}>${ingresos.toLocaleString("es-CO")}</div>
                    <div style={{fontSize:11,color:"#6b7280"}}>COP</div>
                  </div>
                  <div style={{...card,border:"1px solid #22c55e33"}}>
                    <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>LISTOS PARA ALQUILAR</div>
                    <div style={{fontSize:22,fontWeight:900,color:"#22c55e"}}>{listos}</div>
                    <div style={{fontSize:11,color:"#6b7280"}}>con docs al dia</div>
                  </div>
                </div>
                <div style={card}>
                  <div style={{fontSize:14,fontWeight:700,color:"#f1f5f9",marginBottom:10}}>Documentos pendientes</div>
                  {cars.filter(c=>!docsOk(c)).map(c=>(
                    <div key={c.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",background:"#0a0a0f",borderRadius:8,marginBottom:6}}>
                      <span style={{fontWeight:600,fontSize:13}}>{c.marca} {c.modelo} <span style={{color:"#6b7280",fontWeight:400}}>{c.placa}</span></span>
                      <span style={{fontSize:12,color:"#ef4444"}}>{docsFalt(c).join(", ")}</span>
                    </div>
                  ))}
                  {sinDocs===0 && <div style={{color:"#22c55e",fontSize:13}}>Todos los documentos al dia</div>}
                </div>
              </>
            )}
          </div>
        )}

        {view==="flota" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div>
                <div style={{fontSize:22,fontWeight:900,color:"#f1f5f9"}}>Mi Flota</div>
                <div style={{fontSize:13,color:"#4a4a6a"}}>{cars.length} vehiculos registrados</div>
              </div>
              <button onClick={openNew} style={{padding:"8px 16px",borderRadius:8,border:"none",background:"#f97316",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>+ Agregar</button>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
              {["todos","disponible","alquilado","taller","por_recibir"].map(f=>(
                <button key={f} onClick={()=>setFilter(f)} style={{padding:"6px 14px",borderRadius:20,border:"none",fontSize:12,fontWeight:500,cursor:"pointer",background:filter===f?"#f97316":"#1a1a2e",color:filter===f?"#fff":"#6b7280"}}>
                  {f==="todos"?"Todos":STATUS[f]?.label}
                </button>
              ))}
            </div>
            {loading ? <div style={{color:"#4a4a6a",padding:20}}>Cargando...</div> : (
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:12}}>
                {filtered.map(car=>(
                  <div key={car.id} style={card}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                      <div>
                        <div style={{fontSize:14,fontWeight:700,color:"#f1f5f9"}}>{car.marca} {car.modelo} {car.ano}</div>
                        <div style={{fontSize:12,color:"#6b7280"}}>{car.placa} - {car.color}</div>
                      </div>
                      <Badge color={STATUS[car.status]?.color} bg={STATUS[car.status]?.bg}>{STATUS[car.status]?.label}</Badge>
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                      {DOCS.map(d=>(
                        <span key={d.key} style={{fontSize:10,padding:"2px 7px",borderRadius:10,background:car[d.key]?"#052e16":"#2d0a0a",color:car[d.key]?"#22c55e":"#ef4444",border:`1px solid ${car[d.key]?"#22c55e33":"#ef444433"}`}}>
                          {car[d.key]?"OK":"X"} {d.label}
                        </span>
                      ))}
                    </div>
                    {car.status==="alquilado"&&car.cliente_nombre&&(
                      <div style={{padding:"6px 10px",background:"#1a1000",borderRadius:8,fontSize:12,color:"#f59e0b",marginBottom:8}}>
                        Cliente: {car.cliente_nombre} - hasta {car.alquiler_fin} - ${(car.valor_dia||0).toLocaleString()}/dia
                      </div>
                    )}
                    {car.status==="taller"&&car.taller_motivo&&(
                      <div style={{padding:"6px 10px",background:"#2d0a0a",borderRadius:8,fontSize:12,color:"#ef4444",marginBottom:8}}>
                        Taller: {car.taller_motivo}
                      </div>
                    )}
                    {car.notas&&<div style={{fontSize:12,color:"#818cf8",marginBottom:8}}>Nota: {car.notas}</div>}
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>openEdit(car)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:"#818cf822",color:"#818cf8",cursor:"pointer",fontSize:12,fontWeight:600}}>Editar</button>
                      <button onClick={()=>del(car.id)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:"#ef444422",color:"#ef4444",cursor:"pointer",fontSize:12,fontWeight:600}}>Eliminar</button>
                    </div>
                  </div>
                ))}
                {filtered.length===0&&<div style={{color:"#4a4a6a",fontSize:14,padding:20}}>No hay vehiculos en este estado.</div>}
              </div>
            )}
          </div>
        )}

        {view==="docs" && (
          <div>
            <div style={{fontSize:22,fontWeight:900,color:"#f1f5f9",marginBottom:4}}>Documentos</div>
            <div style={{fontSize:13,color:"#4a4a6a",marginBottom:16}}>{sinDocs} vehiculos con docs incompletos</div>
            {loading ? <div style={{color:"#4a4a6a"}}>Cargando...</div> : (
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",background:"#0f0f1a",borderRadius:12,overflow:"hidden"}}>
                  <thead>
                    <tr style={{background:"#0a0a0f"}}>
                      {["Vehiculo","Placa","Estado","SOAT","Tecno","T.Prop","Seguro",""].map(h=>(
                        <th key={h} style={{padding:"10px 12px",textAlign:"left",fontSize:11,color:"#6b7280",textTransform:"uppercase"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {cars.map(car=>(
                      <tr key={car.id} style={{borderTop:"1px solid #1e1e2e"}}>
                        <td style={{padding:"10px 12px",fontWeight:600,color:"#f1f5f9",fontSize:13}}>{car.marca} {car.modelo}</td>
                        <td style={{padding:"10px 12px",color:"#6b7280",fontSize:12}}>{car.placa}</td>
                        <td style={{padding:"10px 12px"}}><Badge color={STATUS[car.status]?.color} bg={STATUS[car.status]?.bg}>{STATUS[car.status]?.label}</Badge></td>
                        {["soat","tecnomecanica","tarjeta_propiedad","seguro"].map(d=>(
                          <td key={d} style={{padding:"10px 12px",textAlign:"center",fontSize:16}}>{car[d]?"OK":"X"}</td>
                        ))}
                        <td style={{padding:"10px 12px"}}>
                          <button onClick={()=>openEdit(car)} style={{padding:"4px 10px",borderRadius:6,border:"none",background:"#818cf822",color:"#818cf8",cursor:"pointer",fontSize:12}}>Editar</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {view==="alq" && (
          <div>
            <div style={{fontSize:22,fontWeight:900,color:"#f1f5f9",marginBottom:4}}>Alquileres</div>
            <div style={{fontSize:13,color:"#4a4a6a",marginBottom:16}}>{alq} activos / {disp} disponibles</div>
            {loading ? <div style={{color:"#4a4a6a"}}>Cargando...</div> : (
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                <div style={card}>
                  <div style={{fontSize:13,color:"#f59e0b",fontWeight:700,marginBottom:12}}>En Alquiler</div>
                  {cars.filter(c=>c.status==="alquilado").map(car=>(
                    <div key={car.id} style={{padding:"10px",background:"#0a0a0f",borderRadius:10,marginBottom:8}}>
                      <div style={{fontWeight:700,fontSize:13,color:"#f1f5f9"}}>{car.marca} {car.modelo}</div>
                      <div style={{fontSize:12,color:"#f59e0b"}}>${(car.valor_dia||0).toLocaleString()}/dia</div>
                      {car.cliente_nombre&&<div style={{fontSize:12,color:"#6b7280"}}>Cliente: {car.cliente_nombre}</div>}
                      {car.alquiler_fin&&<div style={{fontSize:12,color:"#6b7280"}}>Hasta: {car.alquiler_fin}</div>}
                      <button onClick={()=>openEdit(car)} style={{marginTop:6,padding:"4px 10px",borderRadius:6,border:"none",background:"#818cf822",color:"#818cf8",cursor:"pointer",fontSize:11}}>Editar</button>
                    </div>
                  ))}
                  {alq===0&&<div style={{fontSize:13,color:"#4a4a6a"}}>Sin alquileres activos</div>}
                </div>
                <div style={card}>
                  <div style={{fontSize:13,color:"#22c55e",fontWeight:700,marginBottom:12}}>Disponibles</div>
                  {cars.filter(c=>c.status==="disponible").map(car=>(
                    <div key={car.id} style={{padding:"10px",background:"#0a0a0f",borderRadius:10,marginBottom:8}}>
                      <div style={{fontWeight:700,fontSize:13,color:"#f1f5f9"}}>{car.marca} {car.modelo}</div>
                      <div style={{fontSize:12,color:"#6b7280"}}>{car.placa}</div>
                      <div style={{fontSize:12,color:docsOk(car)?"#22c55e":"#ef4444"}}>{docsOk(car)?"Listo para alquilar":"Docs: "+docsFalt(car).join(", ")}</div>
                      <button onClick={()=>openEdit(car)} style={{marginTop:6,padding:"4px 10px",borderRadius:6,border:"none",background:"#22c55e22",color:"#22c55e",cursor:"pointer",fontSize:11}}>Registrar alquiler</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {view==="ia" && (
          <div>
            <div style={{fontSize:22,fontWeight:900,color:"#f1f5f9",marginBottom:4}}>Asistente IA</div>
            <div style={{fontSize:13,color:"#4a4a6a",marginBottom:12}}>Pregunta sobre tu flota, documentos o estrategia</div>
            {msgs.length===0&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                {["Que carros puedo alquilar hoy?","Cuanto podria ganar este mes?","Que documentos tramitar primero?","Plan para maximizar ingresos"].map((s,i)=>(
                  <button key={i} onClick={()=>askAI(s)} style={{padding:"6px 12px",borderRadius:20,border:"none",fontSize:12,background:"#1a1a2e",color:"#6b7280",cursor:"pointer"}}>{s}</button>
                ))}
              </div>
            )}
            <div style={{...card,display:"flex",flexDirection:"column",height:500}}>
              <div style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:10}}>
                {msgs.length===0&&(
                  <div style={{textAlign:"center",color:"#4a4a6a",marginTop:60}}>
                    <div style={{fontSize:36,marginBottom:8}}>IA</div>
                    <div style={{fontSize:14,color:"#6b7280"}}>Soy tu asistente de flota MardoCars</div>
                  </div>
                )}
                {msgs.map((m,i)=>(
                  <div key={i} style={{
                    alignSelf:m.role==="user"?"flex-end":"flex-start",
                    background:m.role==="user"?"#f97316":"#1a1a2e",
                    color:"#fff",
                    padding:"9px 13px",
                    borderRadius:12,
                    maxWidth:"80%",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"
                  }}>{m.content}</div>
                ))}
                {aiLoad&&<div style={{alignSelf:"flex-start",background:"#1a1a2e",color:"#6b7280",padding:"9px 13px",borderRadius:12,fontSize:13}}>Analizando...</div>}
              </div>
              <div style={{display:"flex",gap:8,padding:12,borderTop:"1px solid #1e1e2e"}}>
                <input style={{...inp,flex:1}} value={aiInp} onChange={e=>setAiInp(e.target.value)}
                  placeholder="Escribe tu pregunta..."
                  onKeyDown={e=>e.key==="Enter"&&aiInp.trim()&&askAI(aiInp.trim())}/>
                <button onClick={()=>aiInp.trim()&&askAI(aiInp.trim())} disabled={aiLoad}
                  style={{padding:"9px 18px",borderRadius:8,border:"none",background:"#f97316",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>
                  {aiLoad?"...":"Enviar"}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>

      {modal==="form"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:16}} onClick={()=>setModal(null)}>
          <div style={{...card,width:"100%",maxWidth:500,maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:16,fontWeight:800,color:"#f1f5f9",marginBottom:16}}>{form.id?"Editar":"Agregar"} vehiculo</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              {[["marca","Marca"],["modelo","Modelo"],["placa","Placa"],["ano","Anio"],["color","Color"]].map(([f,l])=>(
                <div key={f}>
                  <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:4}}>{l}</label>
                  <input style={inp} value={form[f]||""} onChange={e=>setForm(p=>({...p,[f]:e.target.value}))}/>
                </div>
              ))}
              <div>
                <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:4}}>Estado</label>
                <select style={inp} value={form.status||"disponible"} onChange={e=>setForm(p=>({...p,status:e.target.value}))}>
                  {Object.entries(STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                </select>
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:6}}>Documentos</label>
              <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                {DOCS.map(d=>(
                  <label key={d.key} style={{display:"flex",alignItems:"center",gap:5,fontSize:13,cursor:"pointer"}}>
                    <input type="checkbox" checked={!!form[d.key]} onChange={e=>setForm(p=>({...p,[d.key]:e.target.checked}))}/>{d.label}
                  </label>
                ))}
              </div>
            </div>
            {form.status==="alquilado"&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:700,color:"#f59e0b",marginBottom:8}}>Datos del alquiler</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {[["cliente_nombre","Cliente","text"],["cliente_cedula","Cedula","text"],["alquiler_inicio","Inicio","date"],["alquiler_fin","Fin","date"],["valor_dia","Valor/dia","number"]].map(([f,l,t])=>(
                    <div key={f}>
                      <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:4}}>{l}</label>
                      <input style={inp} type={t} value={form[f]||""} onChange={e=>setForm(p=>({...p,[f]:e.target.value}))}/>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {form.status==="taller"&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:700,color:"#ef4444",marginBottom:8}}>Info del taller</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div>
                    <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:4}}>Motivo</label>
                    <input style={inp} value={form.taller_motivo||""} onChange={e=>setForm(p=>({...p,taller_motivo:e.target.value}))}/>
                  </div>
                  <div>
                    <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:4}}>Fecha</label>
                    <input style={inp} type="date" value={form.taller_fecha||""} onChange={e=>setForm(p=>({...p,taller_fecha:e.target.value}))}/>
                  </div>
                </div>
              </div>
            )}
            <div style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:4}}>Notas</label>
              <input style={inp} value={form.notas||""} onChange={e=>setForm(p=>({...p,notas:e.target.value}))} placeholder="Observaciones..."/>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setModal(null)} style={{padding:"9px 18px",borderRadius:8,border:"1px solid #2a2a3e",background:"transparent",color:"#6b7280",cursor:"pointer",fontWeight:600,fontSize:13}}>Cancelar</button>
              <button onClick={save} disabled={saving} style={{padding:"9px 22px",borderRadius:8,border:"none",background:"#f97316",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:13}}>{saving?"Guardando...":"Guardar"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
