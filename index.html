<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MardoCars - Gestión de Flota</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0a0f}::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:2px}
input,select,textarea{font-family:'DM Sans',sans-serif}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { createClient } = supabase;
const { useState, useEffect, useCallback } = React;

const SUPABASE_URL = "https://krjrjhkyabjsgaxrvsoq.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZcVgKCdII5aqKNF1BwN3Ww_a5Pd7fe3";
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS = {
  disponible: { label: "Disponible", color: "#22c55e", bg: "#052e16" },
  alquilado:  { label: "Alquilado",  color: "#f59e0b", bg: "#2d1b00" },
  taller:     { label: "En Taller",  color: "#ef4444", bg: "#2d0a0a" },
  por_recibir:{ label: "Por Recibir",color: "#818cf8", bg: "#1a1a3e" },
};

const DOCS = { soat:"SOAT", tecnomecanica:"Tecnomecánica", tarjeta_propiedad:"Tarj. Propiedad", seguro:"Seguro" };

const S = {
  app:       { minHeight:"100vh", background:"#0a0a0f", color:"#e2e8f0", fontFamily:"'DM Sans',sans-serif", display:"flex" },
  sidebar:   { width:200, minWidth:200, background:"#0f0f1a", borderRight:"1px solid #1e1e2e", display:"flex", flexDirection:"column", position:"sticky", top:0, height:"100vh" },
  logo:      { padding:"20px 16px 16px", borderBottom:"1px solid #1e1e2e" },
  logoT:     { fontSize:16, fontWeight:800, color:"#f97316", letterSpacing:-0.5 },
  logoS:     { fontSize:11, color:"#4a4a6a", marginTop:2 },
  nav:       (a) => ({ display:"flex", alignItems:"center", gap:8, padding:"11px 16px", cursor:"pointer", fontSize:13, fontWeight:a?600:400, color:a?"#f97316":"#6b7280", background:a?"#1a1000":"transparent", borderLeft:a?"3px solid #f97316":"3px solid transparent", transition:"all 0.15s" }),
  main:      { flex:1, padding:"24px 28px", overflowY:"auto", maxHeight:"100vh" },
  title:     { fontSize:22, fontWeight:800, color:"#f1f5f9", letterSpacing:-0.5, marginBottom:4 },
  sub:       { fontSize:13, color:"#4a4a6a", marginBottom:20 },
  grid4:     { display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:20 },
  grid2:     { display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 },
  card:      (c) => ({ background:"#0f0f1a", border:`1px solid ${c}33`, borderRadius:12, padding:"16px 18px" }),
  cardPlain: { background:"#0f0f1a", border:"1px solid #1e1e2e", borderRadius:12, padding:"16px 18px" },
  num:       (c) => ({ fontSize:30, fontWeight:900, color:c, lineHeight:1 }),
  lbl:       { fontSize:11, color:"#6b7280", marginTop:4, textTransform:"uppercase", letterSpacing:1 },
  alert:     { background:"#2d1500", border:"1px solid #f97316", borderRadius:10, padding:"10px 14px", marginBottom:16, fontSize:13, color:"#fb923c", display:"flex", gap:8, alignItems:"center" },
  filterRow: { display:"flex", gap:6, marginBottom:14, flexWrap:"wrap" },
  fBtn:      (a) => ({ padding:"6px 14px", borderRadius:20, border:"none", fontSize:12, fontWeight:500, background:a?"#f97316":"#1a1a2e", color:a?"#fff":"#6b7280", cursor:"pointer" }),
  carGrid:   { display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:12 },
  carCard:   { background:"#0f0f1a", border:"1px solid #1e1e2e", borderRadius:12, padding:16, cursor:"pointer", transition:"border-color 0.15s" },
  cName:     { fontSize:14, fontWeight:700, color:"#f1f5f9" },
  cPlate:    { fontSize:12, color:"#6b7280", marginTop:1 },
  badge:     (c,b) => ({ fontSize:10, fontWeight:600, color:c, background:b, padding:"2px 8px", borderRadius:20, display:"inline-block" }),
  docRow:    { display:"flex", flexWrap:"wrap", gap:3, marginTop:8 },
  docBadge:  (ok) => ({ fontSize:10, padding:"2px 7px", borderRadius:10, background:ok?"#052e16":"#2d0a0a", color:ok?"#22c55e":"#ef4444", border:`1px solid ${ok?"#22c55e33":"#ef444433"}` }),
  infoBox:   (c) => ({ marginTop:8, padding:"7px 10px", background:c, borderRadius:8, fontSize:12 }),
  actBtn:    (c) => ({ padding:"5px 12px", borderRadius:7, border:"none", fontSize:12, fontWeight:600, background:c+"22", color:c, cursor:"pointer" }),
  table:     { width:"100%", borderCollapse:"collapse" },
  th:        { padding:"10px 12px", textAlign:"left", fontSize:11, color:"#6b7280", textTransform:"uppercase", letterSpacing:0.5, fontWeight:600, background:"#0a0a0f" },
  td:        { padding:"10px 12px", fontSize:13, borderTop:"1px solid #1e1e2e" },
  chat:      { background:"#0f0f1a", border:"1px solid #1e1e2e", borderRadius:14, overflow:"hidden", display:"flex", flexDirection:"column", height:520 },
  chatMsgs:  { flex:1, overflowY:"auto", padding:16, display:"flex", flexDirection:"column", gap:10 },
  msgU:      { alignSelf:"flex-end", background:"#f97316", color:"#fff", padding:"9px 13px", borderRadius:"12px 12px 2px 12px", maxWidth:"75%", fontSize:13 },
  msgA:      { alignSelf:"flex-start", background:"#1a1a2e", color:"#e2e8f0", padding:"9px 13px", borderRadius:"12px 12px 12px 2px", maxWidth:"80%", fontSize:13, lineHeight:1.6, whiteSpace:"pre-wrap" },
  chatIn:    { display:"flex", padding:12, borderTop:"1px solid #1e1e2e", gap:8 },
  inp:       { flex:1, background:"#0a0a0f", border:"1px solid #2a2a3e", borderRadius:8, padding:"9px 12px", color:"#e2e8f0", fontSize:13, outline:"none" },
  sendBtn:   { background:"#f97316", color:"#fff", border:"none", borderRadius:8, padding:"9px 18px", fontWeight:700, fontSize:13 },
  overlay:   { position:"fixed", inset:0, background:"#000c", display:"flex", alignItems:"center", justifyContent:"center", zIndex:999, padding:16 },
  modalBox:  { background:"#0f0f1a", border:"1px solid #2a2a3e", borderRadius:16, padding:24, width:"100%", maxWidth:520, maxHeight:"88vh", overflowY:"auto" },
  mTitle:    { fontSize:16, fontWeight:800, color:"#f1f5f9", marginBottom:18 },
  fg:        { marginBottom:14 },
  flabel:    { display:"block", fontSize:11, color:"#6b7280", marginBottom:5, textTransform:"uppercase", letterSpacing:0.5 },
  finp:      { width:"100%", background:"#0a0a0f", border:"1px solid #2a2a3e", borderRadius:8, padding:"9px 11px", color:"#e2e8f0", fontSize:13, outline:"none" },
  fsel:      { width:"100%", background:"#0a0a0f", border:"1px solid #2a2a3e", borderRadius:8, padding:"9px 11px", color:"#e2e8f0", fontSize:13, outline:"none" },
  btnRow:    { display:"flex", gap:8, justifyContent:"flex-end", marginTop:20 },
  cancelBtn: { padding:"9px 18px", borderRadius:8, border:"1px solid #2a2a3e", background:"transparent", color:"#6b7280", cursor:"pointer", fontWeight:600, fontSize:13 },
  saveBtn:   { padding:"9px 22px", borderRadius:8, border:"none", background:"#f97316", color:"#fff", cursor:"pointer", fontWeight:700, fontSize:13 },
  addBtn:    { padding:"8px 16px", borderRadius:8, border:"none", background:"#f97316", color:"#fff", cursor:"pointer", fontWeight:700, fontSize:13 },
  spinner:   { display:"flex", alignItems:"center", justifyContent:"center", padding:40, color:"#4a4a6a", fontSize:14 },
};

function docsOk(car) {
  return car.soat && car.tecnomecanica && car.tarjeta_propiedad && car.seguro;
}
function docsFalt(car) {
  return Object.entries(DOCS).filter(([k])=>!car[k]).map(([,v])=>v);
}

export default function App() {
  const [view, setView] = useState("dashboard");
  const [cars, setCars] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("todos");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [aiMsgs, setAiMsgs] = useState([]);
  const [aiInput, setAiInput] = useState("");
  const [aiLoad, setAiLoad] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    const { data } = await db.from("vehiculos").select("*").order("id");
    if (data) setCars(data);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const stats = {
    total: cars.length,
    disponible: cars.filter(c=>c.status==="disponible").length,
    alquilado:  cars.filter(c=>c.status==="alquilado").length,
    taller:     cars.filter(c=>c.status==="taller").length,
    sinDocs:    cars.filter(c=>!docsOk(c)).length,
    listos:     cars.filter(c=>c.status==="disponible"&&docsOk(c)).length,
    ingresos:   cars.filter(c=>c.status==="alquilado"&&c.alquiler_inicio&&c.alquiler_fin).reduce((a,c)=>{
      const dias=Math.ceil((new Date(c.alquiler_fin)-new Date(c.alquiler_inicio))/86400000)||1;
      return a+(dias*(c.valor_dia||0));
    },0),
  };

  const filtered = filter==="todos" ? cars : cars.filter(c=>c.status===filter);

  function openNew() {
    setForm({ marca:"", modelo:"", placa:"", ano:2024, color:"", status:"disponible", soat:false, tecnomecanica:false, tarjeta_propiedad:false, seguro:false, cliente_nombre:"", cliente_cedula:"", alquiler_inicio:"", alquiler_fin:"", valor_dia:"", taller_motivo:"", taller_fecha:"", notas:"" });
    setModal("form");
  }
  function openEdit(car) { setForm({...car}); setModal("form"); }

  async function saveCar() {
    setSaving(true);
    const payload = {
      marca: form.marca, modelo: form.modelo, placa: form.placa,
      ano: parseInt(form.ano)||2024, color: form.color, status: form.status,
      soat: !!form.soat, tecnomecanica: !!form.tecnomecanica,
      tarjeta_propiedad: !!form.tarjeta_propiedad, seguro: !!form.seguro,
      cliente_nombre: form.cliente_nombre||null, cliente_cedula: form.cliente_cedula||null,
      alquiler_inicio: form.alquiler_inicio||null, alquiler_fin: form.alquiler_fin||null,
      valor_dia: parseInt(form.valor_dia)||null,
      taller_motivo: form.taller_motivo||null, taller_fecha: form.taller_fecha||null,
      notas: form.notas||null,
    };
    if (form.id) {
      await db.from("vehiculos").update(payload).eq("id", form.id);
    } else {
      await db.from("vehiculos").insert(payload);
    }
    await load();
    setSaving(false);
    setModal(null);
  }

  async function deleteCar(id) {
    if (!window.confirm("¿Eliminar este vehículo?")) return;
    await db.from("vehiculos").delete().eq("id", id);
    await load();
  }

  async function askAI(prompt) {
    setAiLoad(true);
    const userMsg = { role:"user", content:prompt };
    setAiMsgs(prev=>[...prev, userMsg]);
    setAiInput("");
    const ctx = `Flota MardoCars:
Total: ${stats.total} | Disponibles: ${stats.disponible} | Alquilados: ${stats.alquilado} | Taller: ${stats.taller}
Listos para alquilar: ${stats.listos} | Sin documentos: ${stats.sinDocs}
Ingresos activos: $${stats.ingresos.toLocaleString("es-CO")} COP
Detalle:
${cars.map(c=>`• ${c.marca} ${c.modelo} (${c.placa}) - ${STATUS[c.status]?.label} - Docs faltantes: ${docsFalt(c).join(",")||"ninguno"}${c.cliente_nombre?` - Cliente: ${c.cliente_nombre}, hasta ${c.alquiler_fin}, $${(c.valor_dia||0).toLocaleString()}/día`:""}${c.taller_motivo?` - Taller: ${c.taller_motivo}`:""}`).join("\n")}`;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          system:`Eres asistente experto en flotas de alquiler de carros en Colombia. Conciso, práctico, en español.\n\n${ctx}`,
          messages:[...aiMsgs, userMsg].map(m=>({ role:m.role, content:m.content })),
        }),
      });
      const data = await res.json();
      const text = data.content?.find(b=>b.type==="text")?.text || "Sin respuesta.";
      setAiMsgs(prev=>[...prev, { role:"assistant", content:text }]);
    } catch {
      setAiMsgs(prev=>[...prev, { role:"assistant", content:"Error de conexión. Intenta de nuevo." }]);
    }
    setAiLoad(false);
  }

  const navItems = [
    { id:"dashboard", icon:"📊", label:"Dashboard" },
    { id:"flota",     icon:"🚘", label:"Mi Flota" },
    { id:"documentos",icon:"📄", label:"Documentos" },
    { id:"alquileres",icon:"🤝", label:"Alquileres" },
    { id:"ia",        icon:"🤖", label:"Asistente IA" },
  ];

  return (
    <div style={S.app}>
      {/* SIDEBAR */}
      <div style={S.sidebar}>
        <div style={S.logo}>
          <div style={S.logoT}>🚗 MardoCars</div>
          <div style={S.logoS}>Gestión de flota</div>
        </div>
        <nav style={{ flex:1, paddingTop:10 }}>
          {navItems.map(n=>(
            <div key={n.id} style={S.nav(view===n.id)} onClick={()=>setView(n.id)}>
              <span>{n.icon}</span>{n.label}
            </div>
          ))}
        </nav>
        <div style={{ padding:12, borderTop:"1px solid #1e1e2e", fontSize:11, color:"#4a4a6a", textAlign:"center" }}>
          {stats.alquilado} alquilados · {stats.disponible} disponibles
        </div>
      </div>

      {/* MAIN */}
      <div style={S.main}>

        {/* DASHBOARD */}
        {view==="dashboard" && (
          <div>
            <div style={S.title}>Dashboard</div>
            <div style={S.sub}>{new Date().toLocaleDateString("es-CO",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
            {stats.sinDocs>0 && (
              <div style={S.alert}>⚠️ <strong>{stats.sinDocs} vehículos</strong> con documentos incompletos — regularizarlos es clave para alquilar legalmente.</div>
            )}
            {loading ? <div style={S.spinner}>⏳ Cargando flota...</div> : (
              <>
                <div style={S.grid4}>
                  {[
                    { l:"Total",      v:stats.total,      c:"#818cf8", i:"🚗" },
                    { l:"Disponibles",v:stats.disponible, c:"#22c55e", i:"✅" },
                    { l:"Alquilados", v:stats.alquilado,  c:"#f59e0b", i:"🤝" },
                    { l:"En Taller",  v:stats.taller,     c:"#ef4444", i:"🔧" },
                  ].map((s,i)=>(
                    <div key={i} style={S.card(s.c)}>
                      <div style={{ fontSize:22, marginBottom:4 }}>{s.i}</div>
                      <div style={S.num(s.c)}>{s.v}</div>
                      <div style={S.lbl}>{s.l}</div>
                    </div>
                  ))}
                </div>
                <div style={S.grid2}>
                  <div style={S.card("#f97316")}>
                    <div style={S.lbl}>💰 Ingresos en curso</div>
                    <div style={{ ...S.num("#f97316"), fontSize:26, marginTop:6 }}>${stats.ingresos.toLocaleString("es-CO")}</div>
                    <div style={{ fontSize:11, color:"#6b7280", marginTop:4 }}>COP · alquileres activos</div>
                  </div>
                  <div style={S.card("#22c55e")}>
                    <div style={S.lbl}>🟢 Listos para alquilar</div>
                    <div style={{ ...S.num("#22c55e"), fontSize:26, marginTop:6 }}>{stats.listos}</div>
                    <div style={{ fontSize:11, color:"#6b7280", marginTop:4 }}>con documentos al día</div>
                  </div>
                </div>
                <div style={S.cardPlain}>
                  <div style={{ fontSize:14, fontWeight:700, color:"#f1f5f9", marginBottom:12 }}>⚡ Documentos pendientes</div>
                  {cars.filter(c=>!docsOk(c)).map(c=>(
                    <div key={c.id} style={{ display:"flex", justifyContent:"space-between", padding:"8px 12px", background:"#0a0a0f", borderRadius:8, marginBottom:6 }}>
                      <span style={{ fontWeight:600, fontSize:13, color:"#f1f5f9" }}>{c.marca} {c.modelo} <span style={{ color:"#6b7280", fontWeight:400 }}>{c.placa}</span></span>
                      <span style={{ fontSize:12, color:"#ef4444" }}>{docsFalt(c).join(", ")}</span>
                    </div>
                  ))}
                  {cars.filter(c=>!docsOk(c)).length===0 && <div style={{ fontSize:13, color:"#22c55e" }}>✅ Todos los documentos al día</div>}
                </div>
              </>
            )}
          </div>
        )}

        {/* FLOTA */}
        {view==="flota" && (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
              <div style={S.title}>Mi Flota</div>
              <button style={S.addBtn} onClick={openNew}>+ Agregar</button>
            </div>
            <div style={S.sub}>{cars.length} vehículos registrados</div>
            <div style={S.filterRow}>
              {["todos","disponible","alquilado","taller","por_recibir"].map(f=>(
                <button key={f} style={S.fBtn(filter===f)} onClick={()=>setFilter(f)}>
                  {f==="todos"?"Todos":STATUS[f]?.label}
                </button>
              ))}
            </div>
            {loading ? <div style={S.spinner}>⏳ Cargando...</div> : (
              <div style={S.carGrid}>
                {filtered.map(car=>(
                  <div key={car.id} style={S.carCard}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                      <div>
                        <div style={S.cName}>{car.marca} {car.modelo} {car.ano}</div>
                        <div style={S.cPlate}>{car.placa} · {car.color}</div>
                      </div>
                      <span style={S.badge(STATUS[car.status]?.color, STATUS[car.status]?.bg)}>{STATUS[car.status]?.label}</span>
                    </div>
                    <div style={S.docRow}>
                      {Object.entries(DOCS).map(([k,v])=>(
                        <span key={k} style={S.docBadge(car[k])}>{car[k]?"✓":"✗"} {v}</span>
                      ))}
                    </div>
                    {car.status==="alquilado"&&car.cliente_nombre&&(
                      <div style={S.infoBox("#1a1000")}>
                        <span style={{ color:"#f59e0b" }}>👤 {car.cliente_nombre} · hasta {car.alquiler_fin} · ${(car.valor_dia||0).toLocaleString()}/día</span>
                      </div>
                    )}
                    {car.status==="taller"&&car.taller_motivo&&(
                      <div style={S.infoBox("#2d0a0a")}>
                        <span style={{ color:"#ef4444" }}>🔧 {car.taller_motivo} · desde {car.taller_fecha}</span>
                      </div>
                    )}
                    {car.notas&&<div style={{ marginTop:6, fontSize:12, color:"#818cf8" }}>📝 {car.notas}</div>}
                    <div style={{ display:"flex", gap:6, marginTop:10 }}>
                      <button style={S.actBtn("#818cf8")} onClick={()=>openEdit(car)}>✏️ Editar</button>
                      <button style={S.actBtn("#ef4444")} onClick={()=>deleteCar(car.id)}>🗑️</button>
                    </div>
                  </div>
                ))}
                {filtered.length===0&&!loading&&<div style={{ color:"#4a4a6a", fontSize:14, padding:20 }}>No hay vehículos en este estado.</div>}
              </div>
            )}
          </div>
        )}

        {/* DOCUMENTOS */}
        {view==="documentos" && (
          <div>
            <div style={S.title}>Control de Documentos</div>
            <div style={S.sub}>{stats.sinDocs} vehículos con documentación incompleta</div>
            {loading ? <div style={S.spinner}>⏳ Cargando...</div> : (
              <div style={{ background:"#0f0f1a", border:"1px solid #1e1e2e", borderRadius:14, overflow:"hidden", overflowX:"auto" }}>
                <table style={S.table}>
                  <thead>
                    <tr>
                      {["Vehículo","Placa","Estado","SOAT","Tecnomecánica","T. Propiedad","Seguro",""].map(h=>(
                        <th key={h} style={S.th}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {cars.map(car=>(
                      <tr key={car.id}>
                        <td style={{ ...S.td, fontWeight:600, color:"#f1f5f9" }}>{car.marca} {car.modelo}</td>
                        <td style={{ ...S.td, color:"#6b7280" }}>{car.placa}</td>
                        <td style={S.td}><span style={S.badge(STATUS[car.status]?.color, STATUS[car.status]?.bg)}>{STATUS[car.status]?.label}</span></td>
                        {["soat","tecnomecanica","tarjeta_propiedad","seguro"].map(d=>(
                          <td key={d} style={{ ...S.td, textAlign:"center" }}>{car[d]?"✅":"❌"}</td>
                        ))}
                        <td style={S.td}><button style={S.actBtn("#818cf8")} onClick={()=>openEdit(car)}>Editar</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {/* ALQUILERES */}
        {view==="alquileres" && (
          <div>
            <div style={S.title}>Alquileres</div>
            <div style={S.sub}>{stats.alquilado} activos · {stats.disponible} disponibles</div>
            {loading ? <div style={S.spinner}>⏳ Cargando...</div> : (
              <div style={S.grid2}>
                <div style={S.cardPlain}>
                  <div style={{ fontSize:13, color:"#f59e0b", fontWeight:700, marginBottom:12 }}>🤝 En Alquiler</div>
                  {cars.filter(c=>c.status==="alquilado").map(car=>(
                    <div key={car.id} style={{ padding:"10px 12px", background:"#0a0a0f", borderRadius:10, marginBottom:8 }}>
                      <div style={{ display:"flex", justifyContent:"space-between" }}>
                        <span style={{ fontWeight:700, fontSize:13, color:"#f1f5f9" }}>{car.marca} {car.modelo}</span>
                        <span style={{ fontSize:12, color:"#f59e0b" }}>${(car.valor_dia||0).toLocaleString()}/día</span>
                      </div>
                      {car.cliente_nombre&&<div style={{ fontSize:12, color:"#6b7280", marginTop:2 }}>👤 {car.cliente_nombre} · {car.cliente_cedula}</div>}
                      {car.alquiler_fin&&<div style={{ fontSize:12, color:"#6b7280" }}>📅 {car.alquiler_inicio} → {car.alquiler_fin}</div>}
                      {!docsOk(car)&&<div style={{ fontSize:11, color:"#ef4444", marginTop:3 }}>⚠️ Docs: {docsFalt(car).join(", ")}</div>}
                      <button style={{ ...S.actBtn("#818cf8"), marginTop:6 }} onClick={()=>openEdit(car)}>Editar</button>
                    </div>
                  ))}
                  {stats.alquilado===0&&<div style={{ fontSize:13, color:"#4a4a6a" }}>No hay alquileres activos</div>}
                </div>
                <div style={S.cardPlain}>
                  <div style={{ fontSize:13, color:"#22c55e", fontWeight:700, marginBottom:12 }}>✅ Disponibles</div>
                  {cars.filter(c=>c.status==="disponible").map(car=>(
                    <div key={car.id} style={{ padding:"10px 12px", background:"#0a0a0f", borderRadius:10, marginBottom:8 }}>
                      <div style={{ display:"flex", justifyContent:"space-between" }}>
                        <span style={{ fontWeight:700, fontSize:13, color:"#f1f5f9" }}>{car.marca} {car.modelo} {car.ano}</span>
                        <span style={S.badge(docsOk(car)?"#22c55e":"#ef4444", docsOk(car)?"#052e16":"#2d0a0a")}>{docsOk(car)?"Listo":"Incompleto"}</span>
                      </div>
                      <div style={{ fontSize:12, color:"#6b7280", marginTop:2 }}>{car.placa} · {car.color}</div>
                      {!docsOk(car)&&<div style={{ fontSize:11, color:"#f97316", marginTop:2 }}>Falta: {docsFalt(car).join(", ")}</div>}
                      <button style={{ ...S.actBtn("#22c55e"), marginTop:6 }} onClick={()=>openEdit(car)}>+ Registrar alquiler</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* IA */}
        {view==="ia" && (
          <div>
            <div style={S.title}>🤖 Asistente IA</div>
            <div style={S.sub}>Pregunta sobre tu flota, documentos, precios o estrategia</div>
            {aiMsgs.length===0&&(
              <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:14 }}>
                {["¿Qué carros puedo alquilar hoy?","¿Cuánto podría ganar este mes?","¿Qué documentos tramitar primero?","Dame un plan para maximizar ingresos"].map((s,i)=>(
                  <button key={i} style={S.fBtn(false)} onClick={()=>askAI(s)}>{s}</button>
                ))}
              </div>
            )}
            <div style={S.chat}>
              <div style={S.chatMsgs}>
                {aiMsgs.length===0&&(
                  <div style={{ textAlign:"center", color:"#4a4a6a", marginTop:30 }}>
                    <div style={{ fontSize:40, marginBottom:8 }}>🤖</div>
                    <div style={{ fontSize:14, color:"#6b7280", fontWeight:600 }}>Hola, soy tu asistente de flota</div>
                    <div style={{ fontSize:12, marginTop:4 }}>Pregúntame lo que necesites sobre MardoCars</div>
                  </div>
                )}
                {aiMsgs.map((m,i)=>(
                  <div key={i} style={m.role==="user"?S.msgU:S.msgA}>{m.content}</div>
                ))}
                {aiLoad&&<div style={S.msgA}>⏳ Analizando tu flota...</div>}
              </div>
              <div style={S.chatIn}>
                <input style={S.inp} value={aiInput} onChange={e=>setAiInput(e.target.value)}
                  placeholder="Escribe tu pregunta..."
                  onKeyDown={e=>e.key==="Enter"&&aiInput.trim()&&askAI(aiInput.trim())} />
                <button style={S.sendBtn} onClick={()=>aiInput.trim()&&askAI(aiInput.trim())} disabled={aiLoad}>
                  {aiLoad?"...":"Enviar"}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* MODAL */}
      {modal==="form"&&(
        <div style={S.overlay} onClick={()=>setModal(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.mTitle}>{form.id?"✏️ Editar vehículo":"➕ Agregar vehículo"}</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              {[["marca","Marca"],["modelo","Modelo"],["placa","Placa"],["ano","Año"],["color","Color"]].map(([f,l])=>(
                <div key={f} style={S.fg}>
                  <label style={S.flabel}>{l}</label>
                  <input style={S.finp} value={form[f]||""} onChange={e=>setForm(p=>({...p,[f]:e.target.value}))} />
                </div>
              ))}
              <div style={S.fg}>
                <label style={S.flabel}>Estado</label>
                <select style={S.fsel} value={form.status||"disponible"} onChange={e=>setForm(p=>({...p,status:e.target.value}))}>
                  {Object.entries(STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                </select>
              </div>
            </div>
            <div style={S.fg}>
              <label style={S.flabel}>Documentos</label>
              <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
                {Object.entries(DOCS).map(([k,v])=>(
                  <label key={k} style={{ display:"flex", alignItems:"center", gap:5, fontSize:13, cursor:"pointer" }}>
                    <input type="checkbox" checked={!!form[k]} onChange={e=>setForm(p=>({...p,[k]:e.target.checked}))} />{v}
                  </label>
                ))}
              </div>
            </div>
            {form.status==="alquilado"&&(
              <div>
                <div style={{ fontSize:12, fontWeight:700, color:"#f59e0b", marginBottom:10 }}>Datos del alquiler</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                  {[["cliente_nombre","Cliente"],["cliente_cedula","Cédula"],["alquiler_inicio","Inicio","date"],["alquiler_fin","Fin","date"],["valor_dia","Valor/día COP","number"]].map(([f,l,t])=>(
                    <div key={f} style={S.fg}>
                      <label style={S.flabel}>{l}</label>
                      <input style={S.finp} type={t||"text"} value={form[f]||""} onChange={e=>setForm(p=>({...p,[f]:e.target.value}))} />
                    </div>
                  ))}
                </div>
              </div>
            )}
            {form.status==="taller"&&(
              <div>
                <div style={{ fontSize:12, fontWeight:700, color:"#ef4444", marginBottom:10 }}>Info del taller</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                  <div style={S.fg}>
                    <label style={S.flabel}>Motivo</label>
                    <input style={S.finp} value={form.taller_motivo||""} onChange={e=>setForm(p=>({...p,taller_motivo:e.target.value}))} />
                  </div>
                  <div style={S.fg}>
                    <label style={S.flabel}>Fecha entrada</label>
                    <input style={S.finp} type="date" value={form.taller_fecha||""} onChange={e=>setForm(p=>({...p,taller_fecha:e.target.value}))} />
                  </div>
                </div>
              </div>
            )}
            <div style={S.fg}>
              <label style={S.flabel}>Notas</label>
              <input style={S.finp} value={form.notas||""} onChange={e=>setForm(p=>({...p,notas:e.target.value}))} placeholder="Observaciones..." />
            </div>
            <div style={S.btnRow}>
              <button style={S.cancelBtn} onClick={()=>setModal(null)}>Cancelar</button>
              <button style={S.saveBtn} onClick={saveCar} disabled={saving}>{saving?"Guardando...":"Guardar"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
